name: Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW and the Rust target
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-gnu
      - name: Collect
        run: |
          mkdir -p ../dist
          cp target/x86_64-pc-windows-gnu/release/robodust.exe ../dist/RoboDust-Windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: RoboDust-Windows
          path: dist/RoboDust-Windows.exe
